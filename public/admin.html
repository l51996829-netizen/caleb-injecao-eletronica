<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Caleb Injeção Eletrônica</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1100px;margin:45px auto;padding:0 20px}.admin-card{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:12px;margin:20px 0}.admin-form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.admin-form input,.admin-form textarea{padding:12px;background:#0b1016;border:1px solid var(--line);color:white;border-radius:6px}.admin-form textarea{grid-column:1/-1}.admin-form button{grid-column:1/-1}.admin-list{display:grid;gap:10px}.admin-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px;border-bottom:1px solid var(--line)}.admin-row small{display:block;color:var(--muted)}.danger{background:#7d2929;color:white;border:0;border-radius:6px;padding:10px}.login{max-width:400px;margin:80px auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.login input{width:100%;padding:12px;margin:8px 0;background:#0b1016;border:1px solid var(--line);color:white}.hidden{display:none}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.admin-row{grid-template-columns:1fr auto}.admin-row button:last-child{grid-column:2}}
</style></head><body><header class="top"><a class="brand" href="index.html"><span class="mark">C</span><span>CALEB <small>PAINEL ADMINISTRATIVO</small></span></a><a href="index.html">Ver loja</a></header>
<section id="login" class="login"><h2>Entrar no painel</h2><p class="muted">Use o usuário administrador cadastrado no Supabase.</p><form id="loginForm"><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><button class="btn full">Entrar</button></form><p id="loginMsg" class="muted"></p></section>
<main id="app" class="admin-wrap hidden"><div class="section-title"><div><p class="eyebrow">ADMINISTRAÇÃO</p><h2>Gerenciar a loja</h2></div><button id="logout" class="btn">Sair</button></div>
<section class="admin-card"><h3>Cadastrar produto</h3><form id="productForm" class="admin-form"><input name="name" placeholder="Nome do produto" required><input name="price" type="number" min="0.01" step="0.01" placeholder="Preço (R$)" required><input name="stock" type="number" min="0" step="1" placeholder="Estoque" required><input name="image_url" type="url" placeholder="URL da foto (opcional)"><textarea name="description" placeholder="Descrição do produto"></textarea><button class="btn">Adicionar produto</button></form></section>
<section class="admin-card"><h3>Produtos cadastrados</h3><div id="products" class="admin-list"></div></section>
<section class="admin-card"><h3>Pedidos</h3><p class="muted">Os pedidos e seus status são registrados no banco. O status muda para PAGO após confirmação do Asaas.</p><div id="orders" class="admin-list"></div></section>
</main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
